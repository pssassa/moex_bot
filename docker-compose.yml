services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: moex
      POSTGRES_PASSWORD: moex
      POSTGRES_DB: moex
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moex -d moex"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://moex:moex@db:5432/moex
    dns:
      - 8.8.8.8
      - 77.88.8.8
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://moex:moex@db:5432/moex
    dns:
      - 8.8.8.8
      - 77.88.8.8
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
